[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gripfetch-apt"
version = "0.1.0"
description = "gripsack sugar: fetch Debian packages through the gripfetch-apt plugin (wraps the host's apt)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "gripsack-dev" }]
keywords = ["gripsack", "gripfetch", "apt", "debian"]
urls = { Repository = "https://github.com/gripsack-dev/gripfetch-apt" }
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/gripfetch_apt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
